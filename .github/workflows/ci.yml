name: CI

# Each tool has its own job, run when its folder or the shared setup changes.
on:
  push:
    branches: [main]
    paths: ["tree-extractor/**", "package.json", "package-lock.json", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["tree-extractor/**", "package.json", "package-lock.json", ".github/workflows/ci.yml"]

jobs:
  tree-extractor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tree-extractor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Dependencies are installed once for all the tools, from the root.
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run spellcheck
      - run: npm test
      - run: npm run build:web
      # Drives the built viewer in headless Chromium through one editing session.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      # Runs every case whose image is present: the committed synthetic figures and any
      # committed CC BY figures. Fails if a case listed in bench/expectations.json is no longer
      # identical. Tesseract language data is downloaded on first use.
      - run: npm run bench:strict
