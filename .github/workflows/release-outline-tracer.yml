name: Release the outline tracer

# Each tool is released by its own tag, outline-tracer-v1.2.3 for this one.
# Publishes a release when such a tag is pushed: checks the code, packs the tarball, attaches it
# to a GitHub release with the changelog entry as notes, and tells open-paleo/web and
# open-paleo/media, which pin the tarball by URL and hash and each open a pull request to move the
# pin.
on:
  push:
    tags: ["outline-tracer-v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outline-tracer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Dependencies are installed once for all the tools, from the root.
      - run: npm ci
        working-directory: .

      # The tag must name the version in package.json, or the tarball and the release disagree.
      - name: Check the tag against the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "outline-tracer-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run spellcheck
      - run: npm run build

      # npm pack runs the build again through prepack and prints the tarball's name. The
      # integrity string is the form a package lockfile records.
      - name: Pack the tarball
        run: |
          tarball=$(npm pack --silent | tail -1)
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "INTEGRITY=sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)" >> "$GITHUB_ENV"

      # The notes are the changelog entry for this version: the lines between its heading and
      # the next one.
      - name: Write the release notes
        run: |
          awk -v version="$VERSION" '
            /^## / { printing = index($0, "## " version " ") == 1 || $0 == "## " version; next }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$TARBALL" --title "outline-tracer $VERSION" --notes-file release-notes.md

      # A missed notification must not fail the release: the pins can be moved by hand. Each token
      # is a fine-grained one scoped to its repository; -f, not -F, so every value is sent as a
      # string.
      - name: Tell the web repository a release landed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WEB_DISPATCH_TOKEN }}
        run: |
          gh api repos/open-paleo/web/dispatches \
            -f event_type=outline-tracer-released \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[tag]=$GITHUB_REF_NAME" \
            -f "client_payload[tarball_url]=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$TARBALL" \
            -f "client_payload[integrity]=$INTEGRITY"

      - name: Tell the media repository a release landed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MEDIA_DISPATCH_TOKEN }}
        run: |
          gh api repos/open-paleo/media/dispatches \
            -f event_type=outline-tracer-released \
            -f "client_payload[version]=$VERSION" \
            -f "client_payload[tag]=$GITHUB_REF_NAME" \
            -f "client_payload[tarball_url]=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$TARBALL" \
            -f "client_payload[integrity]=$INTEGRITY"
